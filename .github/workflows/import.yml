name: Import questionnaire materials
on:
  push:
    paths: ['.github/workflows/import.yml']
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: target
      - uses: actions/checkout@v4
        with:
          repository: chris82829/helena-chiir-2027-research-materials
          ref: 3995d5adb5d7a4d17d8cda3ad9d5bcb6c90f25e3
          path: source
          persist-credentials: false
      - name: Copy questionnaire and individual responses
        run: |
          test ! -d source/system
          cp -R source/participants source/questionnaire target/
          cp source/README.txt target/README.md
          cd target
          test "$(find participants -name answer.txt | wc -l)" -eq 8328
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add participants questionnaire README.md
          git commit -m 'Add questionnaire and individual responses'
          git push origin HEAD:main
